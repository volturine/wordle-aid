stages:
  - test
  - build
  - release

variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  BUILDAH_ISOLATION: chroot
  BUILDAH_LAYERS: "true"
  DOCKERFILE_PATH: "${CI_PROJECT_DIR}/dockerfile"
  FQ_IMAGE_NAME: "$CI_REGISTRY_IMAGE:latest"

default:
  image: quay.io/buildah/stable
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ------------------------------------------------------------------------------
# Backend Tests
# ------------------------------------------------------------------------------
backend-tests:
  stage: test
  image: python:3.11
  before_script:
    - pip install uv
    - cd backend
  script:
    - uv run pytest tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH =~ /^dev/

# ------------------------------------------------------------------------------
# Build & Push Multi-Arch Image (master/main branch) - Production
# ------------------------------------------------------------------------------
build-amd64-prod:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  script:
    - buildah build --platform=linux/amd64 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:amd64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:amd64"

build-arm64-prod:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  script:
    - buildah build --platform=linux/arm64/v8 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:arm64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:arm64"

create-manifest-prod:
  stage: build
  needs: ["build-arm64-prod", "build-amd64-prod"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  script:
    - buildah pull "docker://${CI_REGISTRY_IMAGE}:amd64"
    - buildah pull "docker://${CI_REGISTRY_IMAGE}:arm64"
    - buildah manifest rm "$FQ_IMAGE_NAME" || true
    - buildah manifest create --amend "$FQ_IMAGE_NAME"
    - buildah manifest add "$FQ_IMAGE_NAME" "docker://${CI_REGISTRY_IMAGE}:amd64"
    - buildah manifest add "$FQ_IMAGE_NAME" "docker://${CI_REGISTRY_IMAGE}:arm64"
    - buildah manifest push --all --format docker "$FQ_IMAGE_NAME" "docker://${CI_REGISTRY_IMAGE}:latest"
    - buildah manifest push --all --format docker "$FQ_IMAGE_NAME" "docker://${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

# ------------------------------------------------------------------------------
# Build & Push Multi-Arch Image (merge requests) - Development/Preview
# ------------------------------------------------------------------------------
build-amd64-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")
      when: manual
      allow_failure: true
  script:
    - MR_BASE_TAG="pr-${CI_MERGE_REQUEST_IID}"
    - buildah build --platform=linux/amd64 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}-amd64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}-amd64"

build-arm64-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")
      when: manual
      allow_failure: true
  script:
    - MR_BASE_TAG="pr-${CI_MERGE_REQUEST_IID}"
    - buildah build --platform=linux/arm64/v8 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}-arm64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}-arm64"

create-manifest-mr:
  stage: build
  needs: ["build-arm64-mr", "build-amd64-mr"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")
      when: manual
      allow_failure: true
  script:
    - MR_BASE_TAG="pr-${CI_MERGE_REQUEST_IID}"
    - BRANCH_TAG=$(echo "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" | sed 's|/|-|g')
    - buildah manifest rm "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}" || true
    - buildah manifest create --amend "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}"
    - buildah manifest add "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}" "docker://${CI_REGISTRY_IMAGE}:${MR_BASE_TAG}-amd64"
    - buildah manifest add "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}" "docker://${CI_REGISTRY_IMAGE}:${MR_BASE_TAG}-arm64"
    - buildah manifest push --all --format docker "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}"
    - buildah manifest push --all --format docker "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}" "docker://${CI_REGISTRY_IMAGE}:${BRANCH_TAG}"
    - buildah manifest push --all --format docker "$CI_REGISTRY_IMAGE:${MR_BASE_TAG}" "docker://${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

# ------------------------------------------------------------------------------
# Build & Push Multi-Arch Image (Tags) - Versioned Release
# ------------------------------------------------------------------------------
build-tag-amd64:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - buildah build --platform=linux/amd64 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64"

build-tag-arm64:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - buildah build --platform=linux/arm64/v8 -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64" "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64"

create-tag-manifest:
  stage: build
  needs: ["build-tag-amd64", "build-tag-arm64"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - buildah manifest rm "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" || true
    - buildah manifest create --amend "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - buildah manifest add "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "docker://${CI_REGISTRY_IMAGE}:$CI_COMMIT_TAG-amd64"
    - buildah manifest add "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "docker://${CI_REGISTRY_IMAGE}:$CI_COMMIT_TAG-arm64"
    - buildah manifest push --all --format docker "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

# ------------------------------------------------------------------------------
# Create Release on Tag (with Auto-Changelog)
# ------------------------------------------------------------------------------
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["create-tag-manifest"]
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      # Fetch all tags to calculate differences
      git fetch --tags
      # Get the previous tag (ignoring current tag)
      PREV_TAG=$(git describe --tags --abbrev=0 ${CI_COMMIT_TAG}^ 2>/dev/null || echo "")
      if [ -z "$PREV_TAG" ]; then
        CHANGELOG=$(git log --pretty=format:"- %s (%h)" $CI_COMMIT_TAG)
      else
        CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${CI_COMMIT_TAG})
      fi
      # Save to dotenv for the release section
      echo "RELEASE_CHANGELOG=$CHANGELOG" >> release.env
  artifacts:
    reports:
      dotenv: release.env
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Container Image

      **Registry URL:** `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`

      **Pull Command:**
      ```bash
      docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      ```

      ## Changelog
      $RELEASE_CHANGELOG

      ### Multi-Architecture Support
      - linux/amd64
      - linux/arm64/v8

      ### Build Information
      - **Commit SHA:** $CI_COMMIT_SHA
      - **Pipeline URL:** $CI_PIPELINE_URL
      - **Released At:** $CI_PIPELINE_CREATED_AT
    assets:
      links:
        - name: "Container Image (amd64)"
          url: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64"
          link_type: image
        - name: "Container Image (arm64)"
          url: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64"
          link_type: image
