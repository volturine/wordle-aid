<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#376a34" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />

		<!-- Optional Android Enhancements -->
		<meta name="format-detection" content="telephone=no" />
		<meta name="screen-orientation" content="portrait" />
		<meta name="application-name" content="Wordle Aid" />
		<meta name="msapplication-TileColor" content="#376a34" />
		<meta name="msapplication-TileImage" content="/apple-touch-icon-144x144.png" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#376a34" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#6aaa64" />

		<!-- Apple iOS Meta Tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Wordle Aid" />
		<meta name="apple-touch-fullscreen" content="yes" />

		<!-- Apple Touch Icons -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57x57.png" />
		<link rel="apple-touch-icon" sizes="60x60" href="/apple-touch-icon-60x60.png" />
		<link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon-72x72.png" />
		<link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-76x76.png" />
		<link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon-114x114.png" />
		<link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
		<link rel="apple-touch-icon" sizes="144x144" href="/apple-touch-icon-144x144.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

		<!-- Site icons -->
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="shortcut icon" href="/favicon.ico" />

		<meta name="google-adsense-account" content="ca-pub-4557817176793076" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
