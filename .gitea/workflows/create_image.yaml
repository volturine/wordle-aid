  build-and-push-2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          create: true

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.kripso-world.com
          username: ${{ secrets.ACTION_USERNAME }}
          password: ${{ secrets.ACTION_PASSWORD }}

      - name: Deploy
        run: |
          docker build -t gitea.kripso-world.com/${{ gitea.repository }}:latest .
          docker push gitea.kripso-world.com/${{ gitea.repository }}