services:
  wordle-aid:
    restart: unless-stopped
    container_name: wordle-aid
    stdin_open: true # equivalent to -i
    tty: true # equivalent to -t
    image: gitea.kripso-world.com/kripso/wordle_aid:latest
    # privileged: false
    user: 1000:1000
    ports:
      - 8000:8000
    environment:
      PROD_MODE_ENABLED: true
      RAPID_API_KEY: "${RAPID_API_KEY}"
      RAPID_API_HOST: "${RAPID_API_HOST}"
      DB_ROOT_PATH: /home/wordle_helper/database
    volumes:
      - database:/home/wordle_helper/database
    # labels:
    #   - com.centurylinklabs.watchtower.enable=true
