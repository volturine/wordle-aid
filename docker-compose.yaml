version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "9191:9191"
    restart: unless-stopped
  frontend:
    build: ./front-end
    ports:
      - "9192:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URL=http://wordle-backend:9191
      - VITE_API_BASE=http://rolands-mac-mini.bee-justice.ts.net:9191
    restart: unless-stopped
