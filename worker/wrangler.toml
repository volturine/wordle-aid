name = "wordle-aid"
main = "src/worker.py"
compatibility_date = "2025-09-01"
compatibility_flags = ["python_workers"]

[vars]
RAPID_API_HOST = "wordsapiv1.p.rapidapi.com"

# Secret (set with: pywrangler secret put RAPID_API_KEY):
#   RAPID_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "wordle-aid"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[assets]
directory = "./public"
binding = "ASSETS"
# Only API requests hit the worker; everything else is served
# directly from static assets without invoking the worker.
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[observability]
enabled = true
