name: Feature request
description: Suggest an improvement or new capability
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve. Features should respect the
        project's shape: a stateless, no-accounts helper — the server stores a
        static dictionary and a definitions cache only.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Wordle Aid behave if this is implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
