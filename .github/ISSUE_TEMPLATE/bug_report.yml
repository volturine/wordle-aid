name: Bug report
description: Something is broken or behaves unexpectedly
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues:** do not use this form. Report privately via
        [SECURITY.md](https://github.com/volturine/wordle-aid/blob/master/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow.
      placeholder: |
        1. Open https://wordle-aid.com …
        2. Enter guesses …
        3. Apply feedback …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device (and wordle-aid.com vs dev.wordle-aid.com).
    validations:
      required: true
