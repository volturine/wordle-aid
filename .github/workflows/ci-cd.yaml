name: CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c2933b0c8428194e5a16c5abe9178556 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Stage frontend for the worker
        run: |
          rm -rf worker/public
          mkdir -p worker/public
          cp -R frontend/build/. worker/public/

      - name: Syntax-check worker Python
        run: python3 -m py_compile worker/src/*.py

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aa6b6f58ff29668aed9f923689 # v7.1.3

      - name: Sync worker dependencies
        working-directory: worker
        run: uv sync

      - name: Validate Cloudflare deployments
        working-directory: worker
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --env dev

  deploy-cloudflare-dev:
    name: Deploy Cloudflare development
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-dev')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-development
      cancel-in-progress: false
    environment:
      name: development
      url: https://dev.wordle-aid.com
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify development deployment ownership
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owners="$(gh pr list --state open --label deploy-dev --limit 100 --json number --jq 'map(.number) | join(" ")')"
          if [ "$owners" != "$PR_NUMBER" ]; then
            echo "Exactly this PR must be the sole open PR labeled deploy-dev; found: ${owners:-none}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c2933b0c8428194e5a16c5abe9178556 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and stage frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../worker/public
          mkdir -p ../worker/public
          cp -R build/. ../worker/public/

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aa6b6f58ff29668aed9f923689 # v7.1.3

      - name: Reset development data and apply schema
        working-directory: worker
        run: |
          npx wrangler d1 execute wordle-aid-dev --remote --file migrations/0001_words.sql
          npx wrangler d1 execute wordle-aid-dev --remote --file migrations/0002_definitions.sql

      - name: Deploy development Worker
        working-directory: worker
        run: |
          test -n "$RAPID_API_KEY"
          uv run pywrangler deploy --env dev
          printf '%s' "$RAPID_API_KEY" | npx wrangler secret put RAPID_API_KEY --env dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}

      - name: Verify development deployment
        run: >-
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors
          https://dev.wordle-aid.com/api/health

  deploy-cloudflare-production:
    name: Deploy Cloudflare production
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wordle-aid.com
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c2933b0c8428194e5a16c5abe9178556 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and stage frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../worker/public
          mkdir -p ../worker/public
          cp -R build/. ../worker/public/

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aa6b6f58ff29668aed9f923689 # v7.1.3

      - name: Apply schema to production D1
        working-directory: worker
        run: |
          npx wrangler d1 execute wordle-aid --remote --file migrations/0000_schema.sql

      - name: Deploy production Worker
        working-directory: worker
        run: |
          test -n "$RAPID_API_KEY"
          uv run pywrangler deploy
          printf '%s' "$RAPID_API_KEY" | npx wrangler secret put RAPID_API_KEY
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}

      - name: Verify production deployment
        run: >-
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors
          https://wordle-aid.com/api/health
