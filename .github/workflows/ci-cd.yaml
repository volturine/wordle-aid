name: CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test and build frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run svelte-check
          npm run build

      - name: Stage frontend for the worker
        run: |
          rm -rf worker/public
          mkdir -p worker/public
          cp -R frontend/build/. worker/public/

      - name: Test and syntax-check worker Python
        run: |
          python3 -m unittest discover -s worker/tests -v
          python3 -m py_compile worker/src/*.py worker/scripts/*.py

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Sync worker dependencies
        working-directory: worker
        run: uv sync --frozen

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm ci

      - name: Validate Cloudflare deployments
        working-directory: worker
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --env dev

  deploy-cloudflare-dev:
    name: Deploy Cloudflare development
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-dev')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-development
      cancel-in-progress: false
    environment:
      name: development
      url: https://dev.wordle-aid.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify development deployment ownership
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owners="$(gh pr list --state open --label deploy-dev --limit 100 --json number --jq 'map(.number) | join(" ")')"
          if [ "$owners" != "$PR_NUMBER" ]; then
            echo "Exactly this PR must be the sole open PR labeled deploy-dev; found: ${owners:-none}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build and stage frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../worker/public
          mkdir -p ../worker/public
          cp -R build/. ../worker/public/

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm ci

      - name: Apply schema and dictionary to development D1
        working-directory: worker
        run: python3 scripts/apply_dictionary.py wordle-aid-dev --remote

      - name: Deploy development Worker
        working-directory: worker
        run: |
          test -n "$RAPID_API_KEY"
          uv run pywrangler deploy --env dev
          printf '%s' "$RAPID_API_KEY" | npx wrangler secret put RAPID_API_KEY --env dev

      - name: Verify development deployment
        run: >-
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors
          https://dev.wordle-aid.com/api/health

  deploy-cloudflare-production:
    name: Deploy Cloudflare production
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wordle-aid.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build and stage frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../worker/public
          mkdir -p ../worker/public
          cp -R build/. ../worker/public/

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm ci

      - name: Apply schema and dictionary to production D1
        working-directory: worker
        run: python3 scripts/apply_dictionary.py wordle-aid --remote

      - name: Deploy production Worker
        working-directory: worker
        run: |
          test -n "$RAPID_API_KEY"
          uv run pywrangler deploy
          printf '%s' "$RAPID_API_KEY" | npx wrangler secret put RAPID_API_KEY

      - name: Verify production deployment
        run: >-
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors
          https://wordle-aid.com/api/health
